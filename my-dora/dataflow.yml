nodes:
  - id: talker_1 # 定义一个节点并赋予其唯一的名称，每个节点作为系统上的单独进程启动
    build: cargo build -p talker_1
    path: target/debug/talker_1
    inputs:
      tick: dora/timer/secs/1 # 定时器，1秒触发一次
    outputs: # 节点输出
      - speech
  - id: talker_2
    build: cargo build -p talker_2
    path: target/debug/talker_2
    inputs:
      tick: dora/timer/secs/1 # 定时器，1秒触发一次
    outputs:
      - speech

  # 监听talker_1和talker_2的输出
  # 根据 YAML 中定义的 inputs 和 outputs 以及它们的连接方式，DORA 在这些正在运行的节点进程之间建立了通信通道。
  # 当有数据过来的时，会自动监听输出的数据，作为输入
  # 它由 YAML 文件描述，类似于管道图，显示了一个节点的输出与另一个节点的输入之间的连接
  - id: listener_1
    build: cargo build -p listener_1
    path: target/debug/listener_1
    inputs:
      tick: dora/timer/secs/1 # 定时器，1秒触发一次
      speech-1: talker_1/speech
      speech-2: talker_2/speech
